<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulasi Perubahan KKP</title>
  <style>
    :root{--ink:#182536;--muted:#5e6d7f;--blue:#1769df;--green:#168264;--orange:#dc7c22;--red:#c34c5a}*{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:var(--ink);font-family:Arial,sans-serif}.app{max-width:1200px;margin:auto;padding:30px 18px}h1{margin:0 0 7px;font-size:clamp(1.7rem,4vw,2.35rem)}.intro{margin:0 0 22px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(270px,1fr);gap:20px}.plot,.panel{background:#fff;border:1px solid #dce6f0;border-radius:16px;box-shadow:0 10px 26px #27456812}.plot{padding:14px}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}.hint{font-size:.84rem;color:var(--muted);text-align:center;margin:7px 0 0}.panel{padding:20px}.tag{font-size:.72rem;letter-spacing:.1em;font-weight:bold;color:var(--blue);margin:0 0 8px}.panel h2{margin:0;font-size:1.25rem}.panel>p:not(.tag){color:var(--muted);line-height:1.45}.modes{display:grid;gap:7px;margin:15px 0}.modes button{border:1px solid #cbd7e4;background:#fff;border-radius:9px;padding:9px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.modes button.active{background:#eaf3ff;border-color:var(--blue);color:#0955bd;font-weight:bold}.options{display:none;border-top:1px solid #e5edf5;padding-top:13px;margin-top:14px}.options.visible{display:block}.options label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px}.options select{width:100%;padding:8px;border:1px solid #cbd7e4;border-radius:8px;background:#fff;font:inherit}.explanation{margin-top:15px;padding:12px;border-left:4px solid var(--blue);background:#f7faff;font-size:.86rem;line-height:1.45}.legend{font-size:.78rem;color:var(--muted);border-top:1px solid #e4ecf4;margin-top:17px;padding-top:13px;display:grid;gap:7px}.sw{display:inline-block;width:25px;border-top:3px solid;margin-right:7px;vertical-align:middle}.dashed{border-top-style:dashed}@media(max-width:760px){.app{padding:22px 12px}.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app">
    <h1>Simulasi Perubahan Keluk Kemungkinan Pengeluaran</h1>
    <p class="intro">Seret titik jingga untuk mengalih KKP1 berbanding KKP0.</p>
    <section class="layout">
      <div class="plot"><canvas id="chart" width="900" height="560" role="img" aria-label="Perubahan keluk kemungkinan pengeluaran"></canvas><p class="hint" id="hint"></p></div>
      <aside class="panel" aria-live="polite"><p class="tag">BENTUK PERUBAHAN</p><h2 id="title"></h2><p id="description"></p><div class="modes"><button type="button" data-mode="right">1. Beralih ke kanan selari</button><button type="button" data-mode="left">2. Beralih ke kiri selari</button><button type="button" data-mode="increase">3. Satu barang bertambah</button><button type="button" data-mode="decrease">4. Satu barang berkurang</button><button type="button" data-mode="mixed">5. Satu bertambah, satu berkurang</button></div><div class="options" id="options"><label for="variant">Barang yang berubah</label><select id="variant"></select></div><div class="explanation" id="explanation"></div><div class="legend"><span><i class="sw dashed" style="border-color:#8395aa"></i>KKP0 (asal)</span><span><i class="sw" style="border-color:#1769df"></i>KKP1 (baharu)</span><span><i class="sw" style="border-color:#dc7c22"></i>Titik seret</span></div></aside>
    </section>
  </main>
  <script>
  (()=>{
    const c=document.getElementById('chart'),ctx=c.getContext('2d'),W=c.width,H=c.height,m={l:80,r:38,t:40,b:70},MIN_Y=-45,MAX_Y=145,MAX_X=145;
    const sx=q=>m.l+(q-MIN_Y)*(W-m.l-m.r)/(MAX_Y-MIN_Y),sy=q=>H-m.b-q*(H-m.t-m.b)/MAX_X,base=t=>100-t*t/100;
    let mode='right',variant='x',amount=0,drag=false;
    const details={right:['KKP Beralih ke Kanan','Keupayaan pengeluaran kedua-dua barang meningkat.','Pertambahan atau penemuan sumber baharu dan kemajuan teknologi mengembangkan KKP. KKP1 menyentuh kedua-dua paksi pada pintasan yang lebih tinggi.'],left:['KKP Beralih ke Kiri','Keupayaan pengeluaran kedua-dua barang menurun.','Kehilangan sumber, bencana atau kemerosotan teknologi mengecilkan KKP. KKP1 masih menyentuh kedua-dua paksi pada pintasan yang lebih rendah.'],increase:['Satu Barang Bertambah','Hanya keupayaan menghasilkan satu barang meningkat.','Perubahan faktor pengeluaran atau teknologi berlaku khusus kepada barang yang dipilih.'],decrease:['Satu Barang Berkurang','Hanya keupayaan menghasilkan satu barang menurun.','Sumber atau teknologi bagi barang yang dipilih berkurang.'],mixed:['Satu Bertambah, Satu Berkurang','Keupayaan bagi kedua-dua barang berubah dalam arah berbeza.','Sumber dialihkan atau teknologi berubah secara tidak seimbang antara kedua-dua barang.']};
    function text(t,x,y,color,align='left',size=14){ctx.fillStyle=color;ctx.font='bold '+size+'px Arial';ctx.textAlign=align;ctx.fillText(t,x,y);ctx.textAlign='left'}
    function axes(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#e4ecf4';ctx.lineWidth=1;for(let n=0;n<=140;n+=20){ctx.beginPath();ctx.moveTo(sx(n),sy(0));ctx.lineTo(sx(n),sy(140));ctx.stroke();ctx.beginPath();ctx.moveTo(sx(0),sy(n));ctx.lineTo(sx(140),sy(n));ctx.stroke()}ctx.save();ctx.globalAlpha=.12;ctx.translate(sx(53),sy(56));ctx.rotate(-.26);ctx.fillStyle='#1769df';ctx.font='bold 27px Arial';ctx.textAlign='center';ctx.fillText('UNIT EKONOMI KMPh',0,0);ctx.restore();ctx.strokeStyle='#283c52';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx(0),sy(140));ctx.lineTo(sx(0),sy(0));ctx.lineTo(sx(140),sy(0));ctx.stroke();ctx.fillStyle='#52677c';ctx.font='13px Arial';ctx.fillText('Barang X',sx(0)-46,27);ctx.fillText('Barang Y',sx(138),H-20)}
    function curve(fn,color,dashed=false){ctx.save();ctx.setLineDash(dashed?[8,6]:[]);ctx.strokeStyle=color;ctx.lineWidth=dashed?2:3;ctx.lineCap='round';ctx.beginPath();for(let t=0;t<=100;t+=1){const p=fn(t);t?ctx.lineTo(sx(p.y),sy(p.x)):ctx.moveTo(sx(p.y),sy(p.x))}ctx.stroke();ctx.restore()}
    function shifted(t){if(mode==='right'){const cap=100+amount;return{y:t*cap/100,x:cap*(1-t*t/10000)}}if(mode==='left'){const cap=100-amount;return{y:t*cap/100,x:cap*(1-t*t/10000)}}if(mode==='increase'){if(variant==='x')return{y:t,x:(100+amount)*(1-t*t/10000)};return{y:t*(100+amount)/100,x:base(t)}}if(mode==='decrease'){if(variant==='x')return{y:t,x:(100-amount)*(1-t*t/10000)};return{y:t*(100-amount)/100,x:base(t)}}if(variant==='xUp'){return{y:t*(100-amount)/100,x:(100+amount)*(1-t*t/10000)}}return{y:t*(100+amount)/100,x:(100-amount)*(1-t*t/10000)}}
    function handle(){return shifted(50)}
    function settings(){const sel=document.getElementById('variant'),box=document.getElementById('options');if(mode==='increase'||mode==='decrease'){box.classList.add('visible');sel.innerHTML='<option value="x">Barang X</option><option value="y">Barang Y</option>';if(variant!=='x'&&variant!=='y')variant='x'}else if(mode==='mixed'){box.classList.add('visible');sel.innerHTML='<option value="xUp">Barang X bertambah, Barang Y berkurang</option><option value="yUp">Barang Y bertambah, Barang X berkurang</option>';if(variant!=='xUp'&&variant!=='yUp')variant='xUp'}else{box.classList.remove('visible')}}
    function render(){const d=details[mode],p=handle(),end=shifted(100),name='KKP1';axes();curve(t=>({y:t,x:base(t)}),'#8395aa',true);curve(shifted,'#1769df');text('KKP0',sx(100),sy(0)-8,'#6f8296','right');text(name,sx(end.y),sy(end.x)-8,'#1769df','right');ctx.fillStyle='#dc7c22';ctx.beginPath();ctx.arc(sx(p.y),sy(p.x),8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();document.getElementById('title').textContent=d[0];document.getElementById('description').textContent=d[1];document.getElementById('explanation').textContent=d[2];document.getElementById('explanation').style.borderColor=mode==='left'||mode==='decrease'?'#c34c5a':'#1769df';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.getElementById('hint').textContent='Seret titik jingga '+(mode==='right'?'ke atas dan kanan':mode==='left'?'ke bawah dan kiri':mode==='increase'?(variant==='x'?'ke atas':'ke kanan'):mode==='decrease'?(variant==='x'?'ke bawah':'ke kiri'):'secara serong')+' untuk mengubah KKP1.'}
    function pointer(e){const r=c.getBoundingClientRect(),rawY=MIN_Y+(((e.clientX-r.left)*W/r.width-m.l)*(MAX_Y-MIN_Y)/(W-m.l-m.r)),rawX=(H-m.b-(e.clientY-r.top)*H/r.height)*MAX_X/(H-m.t-m.b);return{x:Math.max(0,Math.min(MAX_X,rawX)),y:Math.max(MIN_Y,Math.min(MAX_Y,rawY))}}
    function update(e){const p=pointer(e);if(mode==='right')amount=((p.x/.75-100)+(p.y/.5-100))/2;else if(mode==='left')amount=((100-p.x/.75)+(100-p.y/.5))/2;else if(mode==='increase')amount=variant==='x'?p.x/.75-100:p.y/.5-100;else if(mode==='decrease')amount=variant==='x'?100-p.x/.75:100-p.y/.5;else if(variant==='xUp')amount=((p.x/.75-100)+(100-p.y/.5))/2;else amount=((100-p.x/.75)+(p.y/.5-100))/2;amount=Math.max(0,Math.min(25,amount));render()}
    c.addEventListener('pointerdown',e=>{const p=pointer(e),h=handle();if(Math.hypot(sx(p.y)-sx(h.y),sy(p.x)-sy(h.x))<34){drag=true;c.setPointerCapture(e.pointerId);c.style.cursor='grabbing';update(e);e.preventDefault()}});c.addEventListener('pointermove',e=>{if(drag){update(e);e.preventDefault()}});['pointerup','pointercancel'].forEach(k=>c.addEventListener(k,()=>{drag=false;c.style.cursor='grab'}));document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;amount=0;settings();render()}));document.getElementById('variant').addEventListener('change',e=>{variant=e.target.value;amount=0;render()});settings();render();
  })();
  </script>
</body>
</html>
