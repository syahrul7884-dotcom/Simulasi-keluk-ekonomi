<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPS dan Monopoli</title><style>body{font:16px Arial;margin:0;padding:22px;background:#f5f7fa;color:#172033}main{max-width:920px;margin:auto}h1{color:#12355b;font-size:1.5rem}.box{background:#fff;border:1px solid #d7e0e9;border-radius:12px;padding:14px}svg{width:100%;height:auto;touch-action:none;display:block}.note{margin-top:10px;color:#12355b;font-weight:bold}@media(max-width:600px){body{padding:12px}}</style></head><body><main><h1>PPS dan Monopoli dalam Jangka Panjang</h1><p>Seret keluk biru AR = DD = P untuk monopoli.</p><div class="box"><svg id="g" viewBox="0 0 820 540"></svg><div id="note" class="note"></div></div></main><script>
(()=>{const s=document.getElementById('g'),N='http://www.w3.org/2000/svg',W=820,H=540,m={l:72,r:25,t:30,b:60},x=q=>m.l+q/12*(W-m.l-m.r),y=v=>H-m.b-v/42*(H-m.t-m.b),ac=q=>16+.6*(q-6)**2,avc=q=>9+.42*(q-5)**2,mc=q=>16+1.2*q*(q-6);let A=34,down=false;const e=(t,a={},z='')=>{const n=document.createElementNS(N,t);for(const k in a)n.setAttribute(k,a[k]);n.textContent=z;return n},add=(t,a,z)=>s.append(e(t,a,z)),path=f=>{let d='';for(let q=.2;q<=12;q+=.1)d+=(q===.2?'M':'L')+x(q)+' '+y(f(q))+' ';return d},curve=(f,c,l,q,w=3)=>{add('path',{d:path(f),fill:'none',stroke:c,'stroke-width':w});add('text',{x:x(q)+4,y:y(f(q))-4,fill:c,'font-size':'12','font-weight':'bold'},l)},dash=(a,b,c,d)=>add('line',{x1:a,y1:b,x2:c,y2:d,stroke:'#475569','stroke-dasharray':'5 4'});function draw(){const Qp=6,Pp=16,Qm=(2.8+Math.sqrt(7.84-4.8*(16-A)))/2.4,Pm=A-2.2*Qm,Am=ac(Qm),Mm=mc(Qm),profit=(Pm-Am)*Qm;s.replaceChildren();add('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:'#fff',stroke:'#a7b6c5'});for(let v=0;v<=40;v+=10){add('line',{x1:m.l,y1:y(v),x2:W-m.r,y2:y(v),stroke:'#d9e2ec'});add('text',{x:m.l-8,y:y(v)+4,'text-anchor':'end','font-size':'11'},v)}for(let q=0;q<=12;q+=2)add('text',{x:x(q),y:H-m.b+20,'text-anchor':'middle','font-size':'11'},q);add('line',{x1:m.l,y1:m.t,x2:m.l,y2:H-m.b,stroke:'#172033','stroke-width':2});add('line',{x1:m.l,y1:H-m.b,x2:W-m.r,y2:H-m.b,stroke:'#172033','stroke-width':2});curve(avc,'#d97706','AVC',11);curve(ac,'#7c3aed','AC',11.35);curve(mc,'#b42318','MC',11.7);add('rect',{x:m.l,y:y(Pp),width:x(Qp)-m.l,height:y(0)-y(Pp),fill:'#1769aa18'});add('text',{x:x(2.4),y:y(7),fill:'#1769aa','font-size':'12','font-weight':'bold'},'TR = TC: Untung normal PPS');add('line',{x1:m.l,y1:y(Pp),x2:W-m.r,y2:y(Pp),stroke:'#1769aa','stroke-width':4});add('text',{x:W-m.r-2,y:y(Pp)-7,'text-anchor':'end',fill:'#1769aa','font-weight':'bold'},'AR = MR = DD = P (PPS)');add('circle',{cx:x(Qp),cy:y(Pp),r:6,fill:'#172033'});add('text',{x:x(Qp)+8,y:y(Pp)-8,'font-weight':'bold'},'Epps');dash(x(Qp),y(Pp),x(Qp),H-m.b);add('text',{x:x(Qp),y:H-m.b+42,'text-anchor':'middle','font-weight':'bold'},'Qpps');add('text',{x:m.l-8,y:y(Pp)+4,'text-anchor':'end','font-weight':'bold'},'Ppps');add('circle',{cx:x(Qp),cy:y(Pp),r:10,fill:'none',stroke:'#117a37','stroke-width':2});add('text',{x:x(Qp)+12,y:y(Pp)+18,fill:'#117a37','font-size':'12','font-weight':'bold'},'AC minimum: cekap pengeluaran');curve(q=>A-4.4*q,'#16803a','MR',8);curve(q=>A-2.2*q,'#1769aa','AR = DD = P',9,4);add('rect',{x:m.l,y:y(Pm),width:x(Qm)-m.l,height:y(Am)-y(Pm),fill:'#16a34a32'});add('text',{x:x(Qm/2),y:(y(Pm)+y(Am))/2,fill:'#117a37','font-size':'12','font-weight':'bold'},'Untung lebih normal');add('circle',{cx:x(Qm),cy:y(Mm),r:6,fill:'#172033'});add('text',{x:x(Qm)+8,y:y(Mm)-8,'font-weight':'bold'},'Em');dash(x(Qm),y(Pm),x(Qm),H-m.b);dash(m.l,y(Pm),x(Qm),y(Pm));add('text',{x:x(Qm),y:H-m.b+42,'text-anchor':'middle','font-weight':'bold'},'Qm');add('text',{x:m.l-8,y:y(Pm)+4,'text-anchor':'end','font-weight':'bold'},'Pm');add('line',{x1:x(Qm)+9,y1:y(Pm),x2:x(Qm)+9,y2:y(Mm),stroke:'#b42318','stroke-width':3});add('text',{x:x(Qm)+16,y:(y(Pm)+y(Mm))/2,fill:'#b42318','font-size':'12','font-weight':'bold'},'P > MC: tidak cekap peruntukan');add('circle',{cx:x(Qm),cy:y(Am),r:7,fill:'none',stroke:'#b42318','stroke-width':2});add('text',{x:x(Qm)-10,y:y(Am)+20,fill:'#b42318','font-size':'12','font-weight':'bold'},'AC sedang menurun');add('text',{x:W/2,y:H/2+58,'text-anchor':'middle',fill:'#8392a5',opacity:.22,'font-weight':'bold'},'MSK Ekonomi Channel');document.getElementById('note').innerHTML=`PPS: Epps pada Ppps = MC = AC minimum, Qpps = 6 unit dan untung normal. Monopoli: Em pada MC = MR, Qm = ${Qm.toFixed(2)}, Pm = RM ${Pm.toFixed(2)}, Pm > MC dan untung lebih normal = RM ${profit.toFixed(2)}.`}function move(v){const r=s.getBoundingClientRect(),py=v.clientY-r.top;A=Math.max(30,Math.min(38,(H-m.b-py/r.height*H)*42/(H-m.t-m.b)));draw()}s.onpointerdown=v=>{down=true;s.setPointerCapture(v.pointerId);move(v)};s.onpointermove=v=>{if(down)move(v)};s.onpointerup=()=>down=false;s.onpointercancel=()=>down=false;draw()})();
</script><script>(()=>{const h=document.querySelector('h1');h.insertAdjacentHTML('afterend','<div style="margin:10px 0"><label for="pilih"><b>Pilih penerangan rajah: </b></label><select id="pilih"><option value="1">1. Titik keseimbangan</option><option value="2">2. Harga keseimbangan</option><option value="3">3. Kuantiti keseimbangan</option><option value="4">4. Keuntungan dan jenis keuntungan</option><option value="5">5. Kecekapan pengeluaran</option><option value="6">6. Kecekapan peruntukan sumber</option></select></div><div id="hurai" style="margin:8px 0 14px;padding:10px;border-left:5px solid #1769aa;background:#f1f7fd;color:#12355b;font-weight:bold"></div>');const t={1:'PPS: Epps berlaku apabila MC = MR. Monopoli: Em juga berlaku apabila MC = MR.',2:'Harga PPS ialah Ppps. Harga monopoli ialah Pm, dan Pm lebih tinggi daripada Ppps.',3:'Kuantiti PPS ialah Qpps. Kuantiti monopoli ialah Qm, dan Qm lebih rendah daripada Qpps.',4:'Firma PPS memperoleh untung normal kerana TR = TC atau P = AC. Firma monopoli memperoleh untung lebih normal kerana Pm melebihi AC.',5:'PPS cekap dalam pengeluaran kerana beroperasi pada AC minimum. Monopoli tidak cekap kerana beroperasi ketika AC sedang menurun.',6:'PPS cekap dalam peruntukan sumber kerana Ppps = MC. Monopoli tidak cekap kerana Pm > MC.'};const p=document.getElementById('pilih'),o=document.getElementById('hurai');function u(){o.textContent=t[p.value]}p.addEventListener('change',u);u()})();</script></body></html>
